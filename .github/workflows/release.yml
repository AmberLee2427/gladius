name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check tag and package versions agree
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import ast
          import os
          import pathlib
          import tomllib

          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']
          version = project['version']
          tag = os.environ['RELEASE_TAG']
          if tag != f'v{version}':
              raise SystemExit(f'Tag {tag!r} must equal v{version}')
          module = ast.parse(pathlib.Path('src/gladius/__init__.py').read_text())
          versions = [ast.literal_eval(node.value) for node in module.body
                      if isinstance(node, ast.Assign)
                      and any(isinstance(target, ast.Name) and target.id == '__version__'
                              for target in node.targets)]
          if versions != [version]:
              raise SystemExit('gladius.__version__ must match pyproject.toml')
          print(f'Preparing {project["name"]} {version}')
          PY
      - name: Install build and validation dependencies
        run: python -m pip install '.[test,docs]' build twine ruff
      - name: Tests
        run: python -m pytest
      - name: Lint
        run: python -m ruff check src tests docs/conf.py tools
      - name: Build documentation
        run: python -m sphinx -W -b html docs docs/_build/html
      - name: Build wheel and source archive
        run: python -m build
      - name: Check distribution contents and metadata
        run: |
          python tools/check_distribution.py dist/*
          python -m twine check dist/*
      - name: Test installed wheel outside the checkout
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import gladius; print(gladius.__file__)"
          gladius demo "$RUNNER_TEMP/gladius-release-demo"
      - uses: actions/upload-artifact@v7
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build-and-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-distributions
          path: dist/
      - name: Check PyPI credential is configured
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$PYPI_API_TOKEN" ]; then
            echo 'Add the repository Actions secret PYPI_API_TOKEN before pushing a release tag.' >&2
            exit 1
          fi
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false
