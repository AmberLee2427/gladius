name: Live Roman MAST download

on:
  push:
    branches: [main]
    paths: &paths
      - 'src/**'
      - 'standalone/**'
      - 'tests/integration/**'
      - 'pyproject.toml'
      - '.github/workflows/mast-live.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mast-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  download:
    # Fork PRs cannot read the MAST_API_TOKEN secret.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install package and integration dependencies
        run: python -m pip install '.[test]'
      - name: Query and download one calibrated Roman detector image
        env:
          MAST_API_TOKEN: ${{ secrets.MAST_API_TOKEN }}
          GLADIUS_LIVE_MAST: '1'
          GLADIUS_MAST_REPORT: mast-live-report.json
        run: >-
          python -m pytest tests/integration/test_mast_live.py -m live_mast
          -v -s --tb=short --junitxml=mast-live-results.xml
          -o junit_family=legacy
      - name: Add download coverage to job summary
        if: always()
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          report = Path('mast-live-report.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              if report.exists():
                  data = json.loads(report.read_text())
                  stream.write(f"Downloaded {data['downloaded_bytes']:,} bytes.\n\n")
                  stream.write(f"Coverage: **{data['coverage']}**.\n\n")
                  stream.write(f"Standalone fidelity: {data['standalone_pixel_fidelity']}.\n\n")
                  stream.write(f"Maximum WCS separation: {data['standalone_wcs_max_separation_arcsec']:.3g} arcsec.\n\n")
                  stream.write(f"Metadata: {data['standalone_metadata']}.\n\n")
                  stream.write('Generated target query and temporary-file cleanup passed.\n')
              else:
                  stream.write('Live download did not complete. Check the test failure; '
                               'configure the MAST_API_TOKEN repository secret before running.\n')
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mast-live-test-results
          path: |
            mast-live-results.xml
            mast-live-report.json
          if-no-files-found: warn
          retention-days: 7
