name: Live Roman MAST download

on:
  push:
    paths:
      - 'src/**'
      - 'tests/integration/**'
      - 'pyproject.toml'
      - '.github/workflows/mast-live.yml'
  workflow_dispatch:
    inputs:
      require_calibrated:
        description: 'Require a calibrated image and cutout within the 20 MiB cap'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mast-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  download:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install package and integration dependencies
        run: python -m pip install '.[test,roman,mast]'
      - name: Query and download one small Roman product
        env:
          MAST_API_TOKEN: ${{ secrets.MAST_API_TOKEN }}
          GLADIUS_LIVE_MAST: '1'
          GLADIUS_MAST_REQUIRE_CALIBRATED: ${{ inputs.require_calibrated && '1' || '0' }}
          GLADIUS_MAST_REPORT: mast-live-report.json
        run: >-
          python -m pytest tests/integration/test_mast_live.py -m live_mast
          -v -s --tb=short --junitxml=mast-live-results.xml
          -o junit_family=legacy
      - name: Add download coverage to job summary
        if: always()
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          report = Path('mast-live-report.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              if report.exists():
                  data = json.loads(report.read_text())
                  stream.write(f"Downloaded {data['downloaded_bytes']:,} bytes.\n\n")
                  stream.write(f"Coverage: **{data['coverage']}**.\n\n")
                  stream.write('Generated target query and temporary-file cleanup passed.\n')
              else:
                  stream.write('Live download did not complete. Check the test failure; '
                               'configure the MAST_API_TOKEN repository secret before running.\n')
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mast-live-test-results
          path: |
            mast-live-results.xml
            mast-live-report.json
          if-no-files-found: warn
          retention-days: 7
