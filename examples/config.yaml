# Named workspace; changed settings or inputs create a numbered revision.
run:
  name: default

# Paths are relative to this YAML file. Dates select exposure starts in UTC [start, end).
schema_version: 1
# Or override these targets with --targets targets.csv on run/validate.
targets:
  - id: example-event
    ra: 270.0                    # ICRS degrees; a prediction, not a measured centroid
    dec: -29.0
    metadata: {}                # optional catalogue fields saved with this target
    # Alternatively supply x/y (zero-based parent SCI coordinates), without ra/dec.
inputs:
  mode: directory               # directory | mast
  directory: images
  pattern: '*_cal.asdf'          # FITS SCI/ERR/DQ parents are supported too
  recursive: false
  mast_criteria: {}              # optional overrides; pixel-only MAST targets need e.g. {program: 1043}
  mast_radius_arcmin: 6.0        # candidate search around each RA/Dec target
  product_suffix: _cal
  product_filename: null       # optional exact MAST product filename; Load test pins one
  query_limit: 50000
  prefilter_footprint: true      # skip MAST parents whose footprint (s_region) holds no RA/Dec target
  footprint_margin_arcsec: 10.0  # tolerance for footprint approximations
selection:
  start: null                   # e.g. '2026-01-01T00:00:00'
  end: null                     # exclusive; '2026-02-01' excludes all February
  detectors: []                 # [] means all; otherwise 1 through 18
  filters: []                   # e.g. [F062, F146]
extraction:
  size: 150                     # square, native pixels; odd and even sizes supported
  edge: pad                     # pad | strict
astrometry:
  mode: validate                # use | validate | corrected
  corrected_directory: gaia_wcs  # external solver default; existing files only
  corrected_pattern: '{stem}_gaiawcs.asdf'
  roundtrip_tolerance_pixels: 0.01  # flight inverses round-trip to a few milli-pixels
  fits_tolerance_pixels: 0.01
quality:
  autocorrelation_limit: null   # disabled; exploratory starting point 2.0, review 1.5–3.0
  tile_size: 64
  radius: 15
  exclude_from_stacks: true     # native cutouts are always retained
stacks:
  enabled: false                # display-only, grouped by target and filter
  rgb_enabled: false            # false-colour PNG from three filter medians
  red_filter: F213
  green_filter: F184
  blue_filter: F062
  gif_enabled: false            # aligned individual exposures; independent of median stack
  gif_frame_ms: 500             # playback time per frame; multiples of 10 ms
  max_exposures: 100           # per target/filter; 0 disables check
  max_memory_mb: 512           # preflight estimate; 0 disables check
storage:
  output_directory: cutouts
  retain_full_images: false     # local originals are NEVER deleted
  formats: [asdf, fits]          # add roman_frame for a full-detector Roman-layout copy per cutout
  ancillary_arrays: true        # false drops extra parent planes (chisq, dumo, var_*) from cutouts
  parent_metadata_arrays: true  # false keeps shape/dtype/SHA256 of parent metadata arrays only
  asdf_compression: none        # none | zlib | bzp2 | lz4 (lz4 needs pip install lz4)
  output_links: hardlink        # hardlink | copy; run outputs share cache files when possible
execution:
  resume: true
  continue_on_error: false      # when true, record failures and proceed; CLI still returns nonzero
  abort_after_repeated_failures: 3  # with continue_on_error: stop if the first 3 parents fail alike; 0 disables
  download_workers: 4           # parallel MAST downloads ahead of extraction (1 to 8)
  lock_timeout_seconds: 0
